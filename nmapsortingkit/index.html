<style>
  :root {
    --background: 220 14% 96%;
    --foreground: 221 39% 11%;
    --card: 0 0% 100%;
    --card-foreground: 215 28% 17%;
    --primary: 243 75% 59%;
    --primary-foreground: 0 0% 100%;
    --secondary: 210 20% 98%;
    --secondary-foreground: 215 28% 17%;
    --muted-foreground: 220 9% 46%;
    --accent: 220 14% 96%;
    --accent-foreground: 215 28% 17%;
    --destructive: 0 84% 60%;
    --destructive-foreground: 0 0% 100%;
    --border: 220 13% 84%;
    --input: 220 13% 84%;
    --ring: 243 75% 59%;
    --radius: 0.75rem;
  }
  html.dark {
    --background: 223 39% 7%;
    --foreground: 0 0% 100%;
    --card: 221 39% 11%;
    --card-foreground: 220 13% 91%;
    --secondary: 215 28% 17%;
    --secondary-foreground: 220 13% 91%;
    --muted-foreground: 218 11% 65%;
    --accent: 217 19% 27%;
    --accent-foreground: 220 13% 91%;
    --destructive: 0 63% 31%;
    --destructive-foreground: 220 13% 91%;
    --border: 215 28% 17%;
    --input: 215 14% 34%;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: hsl(var(--background));
    color: hsl(var(--foreground));
    transition: background-color .3s ease, color .3s ease;
  }
  .container {
    max-width: 56rem;
    margin: 0 auto;
    padding: 1.5rem 1.5rem 3rem;
  }
  header { position: relative; text-align: center; margin-bottom: 2rem; }
  header h1 {
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0 0 0.75rem;
  }
  header h1 .shield-icon {
    display: inline-block;
    margin-right: 0.5rem;
    vertical-align: -6px;
    transition: transform .3s ease;
  }
  header:hover .shield-icon { transform: scale(1.1) rotate(8deg); }
  header h1 .gradient {
    background: linear-gradient(90deg, hsl(var(--primary)), #8b5cf6);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header p { margin: 0; font-size: 1.05rem; color: hsl(var(--muted-foreground)); }
  header p a { color: hsl(var(--primary)); text-decoration: underline; text-decoration-color: transparent; transition: text-decoration-color .15s ease; }
  header p a:hover { text-decoration-color: hsl(var(--primary)); }

  #themeToggle {
    position: absolute;
    top: 0;
    right: 0;
    height: 2.5rem;
    width: 2.5rem;
    padding: 0;
    border-radius: 999px;
    background: transparent;
    color: hsl(var(--muted-foreground));
    border: none;
  }
  #themeToggle:hover { background: hsl(var(--accent)); color: hsl(var(--accent-foreground)); }
  #themeToggle svg { width: 1.25rem; height: 1.25rem; }
  #themeToggle .moon-icon { display: none; }
  html.dark #themeToggle .sun-icon { display: none; }
  html.dark #themeToggle .moon-icon { display: inline-block; }

  .panel {
    background: hsl(var(--card));
    border-radius: var(--radius);
    padding: 1.5rem;
    margin-bottom: 1.5rem;
    box-shadow: 0 10px 25px -5px rgb(0 0 0 / 0.08), 0 4px 6px -2px rgb(0 0 0 / 0.04);
    border: 1px solid hsl(var(--border) / 0.6);
    transition: background-color .3s ease, border-color .3s ease;
  }
  .panel h3 {
    font-size: 1.15rem;
    font-weight: 600;
    margin: 0 0 1rem;
    padding-bottom: 0.6rem;
    border-bottom: 1px solid hsl(var(--border));
  }
  label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem; }
  .field { margin-bottom: 1rem; }
  textarea, input[type="text"] {
    width: 100%;
    border: 1px solid hsl(var(--input));
    border-radius: calc(var(--radius) - 0.25rem);
    background: hsl(var(--background));
    padding: 0.6rem 0.75rem;
    font-size: 0.875rem;
    font-family: inherit;
    color: hsl(var(--foreground));
    transition: background-color .3s ease, border-color .2s ease;
  }
  textarea { min-height: 200px; resize: vertical; }
  textarea:focus, input:focus {
    outline: 2px solid hsl(var(--ring));
    outline-offset: 2px;
  }
  .row { display: flex; gap: 0.5rem; }
  .row input { flex: 1; }
  button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.375rem;
    white-space: nowrap;
    border-radius: calc(var(--radius) - 0.25rem);
    font-size: 0.875rem;
    font-weight: 500;
    height: 2.5rem;
    padding: 0 1.1rem;
    cursor: pointer;
    border: 1px solid transparent;
    background: hsl(var(--primary));
    color: hsl(var(--primary-foreground));
    transition: background-color .15s ease, transform .1s ease;
  }
  button:hover:not(:disabled) { background: hsl(var(--primary) / 0.9); }
  button:active:not(:disabled) { transform: scale(0.98); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.outline {
    background: hsl(var(--background));
    color: hsl(var(--foreground));
    border-color: hsl(var(--input));
  }
  button.outline:hover:not(:disabled) { background: hsl(var(--accent)); }
  button.ghost {
    background: transparent;
    color: hsl(var(--foreground));
    border: none;
    height: 2.5rem;
    width: 2.5rem;
    padding: 0;
  }
  button.ghost:hover:not(:disabled) { background: hsl(var(--accent)); }
  .process-btn { margin-top: 0.25rem; }
  .results-grid { display: grid; gap: 1rem; }
  .results-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    margin-bottom: 0.5rem;
  }
  h2 { font-size: 1.05rem; font-weight: 600; margin: 0; }
  button.copy-btn {
    height: 2rem;
    padding: 0 0.75rem;

    color: hsl(var(--secondary-foreground));
    border-color: transparent;
    flex-shrink: 0;
  }
  button.copy-btn:hover:not(:disabled) { background: hsl(var(--accent)); }
  button.copy-btn svg { width: 0.875rem; height: 0.875rem; }
  .result-box { border: 1px solid hsl(var(--border)); border-radius: calc(var(--radius) - 0.25rem); padding: 1rem; }
  .result-box.matched { background: #f0fdf4; border-color: #bbf7d0; }
  .result-box.unmatched { background: #fef2f2; border-color: #fecaca; }
  html.dark .result-box.matched { background: rgb(5 46 22 / 0.4); border-color: rgb(20 83 45 / 0.8); }
  html.dark .result-box.unmatched { background: rgb(69 10 10 / 0.4); border-color: rgb(127 29 29 / 0.8); }
  .empty { color: hsl(var(--muted-foreground)); }
  .service-item {

    cursor: pointer;
    margin-bottom: 0.5rem;

  .service-item:hover { color: hsl(var(--primary)); }
  .card {
    margin-top: 1rem;
    position: relative;
    border: 1px solid hsl(var(--border));

  .card-desc { font-size: 0.875rem; color: hsl(var(--muted-foreground)); margin: 0; }

  .card-content .label { font-weight: 600; }
  .scripts-block { margin-top: 0.5rem; }
  .scripts-block .title { font-weight: 600; margin-bottom: 0.25rem; }
  .scripts-block .item { padding-left: 1rem; white-space: pre-wrap; margin-bottom: 0.25rem; }
  #toast-region {
    position: fixed;
    bottom: 1rem;
    right: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    z-index: 1000;
    max-width: 24rem;
  }
  .toast {
    background: hsl(var(--card));
    border: 1px solid hsl(var(--border));
    border-radius: var(--radius);
    box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    padding: 1rem 2rem 1rem 1rem;
    position: relative;
    animation: slide-in 0.15s ease-out;
  }
  .toast.destructive {
    background: hsl(var(--destructive));
    color: hsl(var(--destructive-foreground));
    border-color: hsl(var(--destructive));
  }
  .toast .toast-title { font-size: 0.875rem; font-weight: 600; margin: 0 0 0.25rem; }
  .toast .toast-desc { font-size: 0.875rem; opacity: 0.9; margin: 0; }
  .toast .toast-close {
    position: absolute;
    right: 0.5rem;
    top: 0.5rem;
    background: none;
    border: none;
    height: 1.5rem;
    width: 1.5rem;
    padding: 0;
    color: inherit;
    opacity: 0.6;
    cursor: pointer;

  .toast .toast-close:hover { opacity: 1; background: none; }
  @keyframes slide-in {
    from { transform: translateY(0.5rem); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  svg.icon { width: 1rem; height: 1rem; flex-shrink: 0; }

  /* tk-font-unify — shared type faces */
  html body, body button { font-family: 'Inter', sans-serif; }
  body code, body pre, body kbd, body samp, body .font-mono,
  body textarea, body input, body select { font-family: 'JetBrains Mono', monospace; }

  /* ── Shared tool format ── */
  body { display:flex; flex-direction:column; align-items:center; padding:2rem 1rem; min-height:100vh; }
  @media(min-width:768px){ body { padding:3rem 1rem; } }
  .container { max-width: 80rem; width:100%; margin: 2rem auto 0; }
  .tk-toggle-wrap { position: fixed; top:1rem; right:1rem; z-index:200; }
  @media(min-width:768px){ .tk-toggle-wrap { top:2rem; right:2rem; } }
  #themeToggle { position:static; width:3rem; height:3rem; border-radius:9999px;
    background: hsl(var(--card)); border:1px solid hsl(var(--border));
    box-shadow: 0 10px 15px -3px rgba(0,0,0,0.25); cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; transition: transform .2s; }
  #themeToggle:hover { transform: scale(1.08); }
  .page-hero { text-align:center; margin-bottom:2rem; }
  .page-hero h1 { font-size: clamp(1.875rem,5vw,3rem); font-weight:800; letter-spacing:-0.025em;
    display:flex; align-items:center; justify-content:center; gap:.75rem; flex-wrap:wrap; }
  .page-hero .tk-anim-logo { display:inline-flex; animation: tk-logo-float 4.5s ease-in-out infinite; transform-origin:center; }
  .page-hero .tk-anim-logo svg { width:2.5rem !important; height:2.5rem !important; }
  @keyframes tk-logo-float { 0%,100%{transform:translateY(0) rotate(0)}
    25%{transform:translateY(-5px) rotate(-6deg)} 75%{transform:translateY(-2px) rotate(6deg)} }
  @media (prefers-reduced-motion: reduce){ .page-hero .tk-anim-logo{animation:none} }
  .hero-sub { color: hsl(var(--muted-foreground)); font-size:.875rem; max-width:36rem; margin:.75rem auto 0; }
  @media(min-width:768px){ .hero-sub { font-size:1.125rem; } }
  footer { margin-top:auto; padding:2rem 1rem; text-align:center; font-size:.75rem;
    font-weight:500; color: hsl(var(--muted-foreground)); width:100%; }</style>

<script>
  function toggleTheme() {
    var html = document.documentElement;
    if (html.classList.contains("dark")) {
      html.classList.remove("dark");
      localStorage.setItem("theme", "light");
    } else {
      html.classList.add("dark");
      localStorage.setItem("theme", "dark");
    }
  }
</script>

<script>
(function () {
  "use strict";

  // ---------- Core nmap parsing/matching logic (ported 1:1 from the original app) ----------

  function parseSearchString(searchString) {
    var matches = searchString.match(/"[^"]+"|[^\s"]+/g) || [];
    return matches.map(function (term) {
      return term.replace(/"/g, "").trim();
    });
  }

  function hasVersionInfo(service) {
    if ((service.version && service.version.trim() !== "") ||
        (service.service && service.service.toLowerCase().indexOf("version") !== -1)) {
      return true;
    }
    return service.scripts.some(function (script) {
      var s = script.toLowerCase();
      return s.indexOf("version:") !== -1 ||
             s.indexOf("version =") !== -1 ||
             /vers?\.?:?\s*\d+/.test(s);
    });
  }

  function matchesSearch(service, searchTerms) {
    var searchableText = [
      service.service, service.version, service.state, service.port
    ].concat(service.scripts.map(function (script) {
      var parts = script.split(":");
      return parts.length > 1
        ? parts[0].trim() + " " + parts.slice(1).join(":").trim()
        : script;
    })).join(" ").toLowerCase();

    return searchTerms.every(function (term) {
      var lower = term.toLowerCase();
      if (lower.indexOf("port:") === 0) {
        var portNumber = term.split(":")[1];
        return service.port === portNumber;
      }
      if (lower === "version:") {
        return hasVersionInfo(service);
      }
      return searchableText.indexOf(lower) !== -1;
    });
  }

  function processNmapResults(nmapResults, searchString) {
    if (!nmapResults || !searchString) {
      throw new Error("Please provide both Nmap results and search string");
    }

    var searchTerms = parseSearchString(searchString);
    var matched = [];
    var unmatched = [];
    var currentService = {};
    var currentScripts = [];
    var inScriptBlock = false;

    function flush() {
      if (currentService.ip && currentService.port) {
        var service = Object.assign({}, currentService, { scripts: currentScripts });
        if (matchesSearch(service, searchTerms)) {
          matched.push(service);
        } else {
          unmatched.push(service);
        }
      }
    }

    var lines = nmapResults.split("\n");
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim();
      if (!line) { inScriptBlock = false; continue; }

      var hostMatch = line.match(/^Nmap scan report for ([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+)/);
      if (hostMatch) {
        flush();
        currentService = { ip: hostMatch[1] };
        currentScripts = [];
        inScriptBlock = false;
        continue;
      }

      var portMatch = line.match(/^(\d+)\/(\w+)\s+(\w+)\s+(.+)/);
      if (portMatch && currentService.ip) {
        flush();
        currentService = Object.assign({}, currentService, {
          port: portMatch[1],
          state: portMatch[3],
          service: portMatch[4] || "",
          version: ""
        });
        if (currentService.service) {
          var vm = currentService.service.match(/version\s+([^,]+)/i);
          if (vm) currentService.version = vm[1];
        }
        currentScripts = [];
        inScriptBlock = false;
        continue;
      }

      if (line.indexOf("|") === 0) {
        var scriptLine = line.replace(/^\|[_]?\s*/, "").trim();
        if (scriptLine) {
          if (scriptLine.indexOf(":") !== -1) {
            currentScripts.push(scriptLine);
            inScriptBlock = true;
          } else if (inScriptBlock) {
            currentScripts[currentScripts.length - 1] += " " + scriptLine;
          }
        }
        continue;
      }
    }

    flush();
    return { matched: matched, unmatched: unmatched };
  }

  function formatVersionResults(services) {
    var withVersions = services.filter(hasVersionInfo);
    if (withVersions.length === 0) {
      return "No services with version information found.";
    }
    return withVersions.map(function (service) {
      var version = service.version;
      if (!version || version.trim() === "") {
        var vm = service.service.match(/version ([^,]+)/i);
        if (vm) {
          version = vm[1];
        } else if (service.service.toLowerCase().indexOf("version") !== -1) {
          version = service.service;
        } else {
          var sv = service.scripts.find(function (script) {
            var s = script.toLowerCase();
            return s.indexOf("version:") !== -1 || s.indexOf("version =") !== -1 || /vers?\.?:?\s*\d+/.test(s);
          });
          if (sv) version = sv;
        }
      }
      return service.ip + ":" + service.port + " - " + service.service + (version ? " (" + version + ")" : "");
    }).join("\n");
  }

  function aiExtractVersions() {
    return new Promise(function (resolve) {
      setTimeout(function () {
        resolve('"version:"');
      }, 1500);
    });
  }

  // ---------- UI wiring ----------

  var nmapInputEl = document.getElementById("nmapInput");
  var searchStringEl = document.getElementById("searchString");
  var extractBtn = document.getElementById("extractBtn");
  var extractLabel = document.getElementById("extractLabel");
  var processBtn = document.getElementById("processBtn");
  var matchedBox = document.getElementById("matchedBox");
  var unmatchedBox = document.getElementById("unmatchedBox");
  var matchedCount = document.getElementById("matchedCount");
  var unmatchedCount = document.getElementById("unmatchedCount");
  var matchedDetails = document.getElementById("matchedDetails");
  var unmatchedDetails = document.getElementById("unmatchedDetails");
  var copyMatchedBtn = document.getElementById("copyMatchedBtn");
  var copyUnmatchedBtn = document.getElementById("copyUnmatchedBtn");
  var toastRegion = document.getElementById("toast-region");

  var state = {
    matched: [],
    unmatched: [],
    selectedMatched: null,
    selectedUnmatched: null,
    isAILoading: false
  };

  function updateButtons() {
    processBtn.disabled = !nmapInputEl.value || !searchStringEl.value;
    extractBtn.disabled = state.isAILoading || !nmapInputEl.value;
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function renderList(box, countEl, services, type) {
    countEl.textContent = services.length;
    box.innerHTML = "";
    if (services.length === 0) {
      var empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "No " + type + " results";
      box.appendChild(empty);
      return;
    }
    var wrap = document.createElement("div");
    services.forEach(function (service, index) {
      var item = document.createElement("div");
      item.className = "service-item";
      item.textContent = service.ip + ":" + service.port;
      item.addEventListener("click", function () {
        if (type === "matched") {
          state.selectedMatched = service;
          state.selectedUnmatched = null;
        } else {
          state.selectedUnmatched = service;
          state.selectedMatched = null;
        }
        renderDetails();
      });
      wrap.appendChild(item);
    });
    box.appendChild(wrap);
  }

  function renderDetailsCard(container, service, type, onClose) {
    container.innerHTML = "";
    if (!service) return;

    var card = document.createElement("div");
    card.className = "card";

    var closeBtn = document.createElement("button");
    closeBtn.className = "ghost card-close";
    closeBtn.innerHTML = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>';
    closeBtn.addEventListener("click", onClose);
    card.appendChild(closeBtn);

    var header = document.createElement("div");
    header.className = "card-header";
    var title = document.createElement("h3");
    title.className = "card-title";
    title.textContent = "Details for " + service.ip + ":" + service.port;
    var desc = document.createElement("p");
    desc.className = "card-desc";
    desc.textContent = (type === "matched" ? "Matched" : "Unmatched") + " result details";
    header.appendChild(title);
    header.appendChild(desc);
    card.appendChild(header);

    var content = document.createElement("div");
    content.className = "card-content";

    var serviceLine = document.createElement("div");
    serviceLine.innerHTML = '<span class="label">Service:</span> ' + escapeHtml(service.service);
    content.appendChild(serviceLine);

    var stateLine = document.createElement("div");
    stateLine.innerHTML = '<span class="label">State:</span> ' + escapeHtml(service.state);
    content.appendChild(stateLine);

    var versionLine = document.createElement("div");
    versionLine.innerHTML = '<span class="label">Version:</span> ' + escapeHtml(service.version || "N/A");
    content.appendChild(versionLine);

    if (service.scripts.length > 0) {
      var scriptsBlock = document.createElement("div");
      scriptsBlock.className = "scripts-block";
      var scriptsTitle = document.createElement("div");
      scriptsTitle.className = "title";
      scriptsTitle.textContent = "Scripts:";
      scriptsBlock.appendChild(scriptsTitle);
      service.scripts.forEach(function (script) {
        var item = document.createElement("div");
        item.className = "item";
        item.textContent = script;
        scriptsBlock.appendChild(item);
      });
      content.appendChild(scriptsBlock);
    }

    card.appendChild(content);
    container.appendChild(card);
  }

  function renderDetails() {
    renderDetailsCard(matchedDetails, state.selectedMatched, "matched", function () {
      state.selectedMatched = null;
      renderDetails();
    });
    renderDetailsCard(unmatchedDetails, state.selectedUnmatched, "unmatched", function () {
      state.selectedUnmatched = null;
      renderDetails();
    });
  }

  function renderResults() {
    renderList(matchedBox, matchedCount, state.matched, "matched");
    renderList(unmatchedBox, unmatchedCount, state.unmatched, "unmatched");
    copyMatchedBtn.disabled = state.matched.length === 0;
    copyUnmatchedBtn.disabled = state.unmatched.length === 0;
    renderDetails();
  }

  // Copies text to the clipboard, falling back to a temporary textarea when the
  // async Clipboard API is unavailable (e.g. opened over file://).
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function (resolve, reject) {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.top = "-1000px";
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      ok ? resolve() : reject(new Error("Clipboard not available"));
    });
  }

  function copyResults(type) {
    var services = type === "matched" ? state.matched : state.unmatched;
    if (services.length === 0) return;

    var text = services.map(function (s) { return s.ip + ":" + s.port; }).join("\n");

    copyText(text).then(function () {
      showToast(
        "Copied to clipboard",
        "Copied " + services.length + " " + type + " " +
          (services.length === 1 ? "entry" : "entries")
      );
    }).catch(function (err) {
      showToast(
        "Copy failed",
        err && err.message ? err.message : "Could not access the clipboard",
        "destructive"
      );
    });
  }

  function showToast(title, description, variant) {
    var toast = document.createElement("div");
    toast.className = "toast" + (variant === "destructive" ? " destructive" : "");

    var titleEl = document.createElement("p");
    titleEl.className = "toast-title";
    titleEl.textContent = title;
    toast.appendChild(titleEl);

    if (description) {
      var descEl = document.createElement("p");
      descEl.className = "toast-desc";
      descEl.textContent = description;
      toast.appendChild(descEl);
    }

    var closeBtn = document.createElement("button");
    closeBtn.className = "toast-close";
    closeBtn.innerHTML = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>';
    closeBtn.addEventListener("click", function () {
      toastRegion.removeChild(toast);
    });
    toast.appendChild(closeBtn);

    toastRegion.appendChild(toast);
    setTimeout(function () {
      if (toast.parentNode) toastRegion.removeChild(toast);
    }, 5000);
  }

  function handleProcess() {
    try {
      var processed = processNmapResults(nmapInputEl.value, searchStringEl.value);
      state.matched = processed.matched;
      state.unmatched = processed.unmatched;
      renderResults();
      showToast(
        "Processing complete",
        "Found " + processed.matched.length + " matched and " + processed.unmatched.length + " unmatched results"
      );
    } catch (err) {
      showToast("Error", err && err.message ? err.message : "An error occurred while processing results", "destructive");
    }
  }

  function handleExtractVersions() {
    state.isAILoading = true;
    extractLabel.textContent = "Analyzing...";
    updateButtons();

    aiExtractVersions().then(function (extractedSearch) {
      searchStringEl.value = extractedSearch;
      try {
        var processed = processNmapResults(nmapInputEl.value, extractedSearch);
        state.matched = processed.matched;
        state.unmatched = processed.unmatched;
        renderResults();
        showToast(
          "Version extraction complete",
          "Found " + processed.matched.length + " services with version information"
        );
      } catch (err) {
        showToast("AI extraction error", err && err.message ? err.message : "An error occurred during version extraction", "destructive");
      }
    }).catch(function (err) {
      showToast("AI extraction error", err && err.message ? err.message : "An error occurred during version extraction", "destructive");
    }).finally(function () {
      state.isAILoading = false;
      extractLabel.textContent = "Extract Versions";
      updateButtons();
    });
  }

  nmapInputEl.addEventListener("input", updateButtons);
  searchStringEl.addEventListener("input", updateButtons);
  processBtn.addEventListener("click", handleProcess);
  extractBtn.addEventListener("click", handleExtractVersions);
  copyMatchedBtn.addEventListener("click", function () { copyResults("matched"); });
  copyUnmatchedBtn.addEventListener("click", function () { copyResults("unmatched"); });

  updateButtons();
})();
</script>
<footer>For authorized security testing only &middot; All processing runs client-side &middot; No data is stored</footer>
</body>
</html>
