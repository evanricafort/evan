    <title>Moved — COOP Tabnabbing PoC</title>
    <!-- This page moved to /tools/coop/. GitHub Pages serves static files and
         cannot return a real 301, so the redirect is done here: rel=canonical
         tells crawlers where the page really lives, the meta refresh moves
         browsers immediately, and the script preserves any ?target= that an
         older report or link is still carrying. -->

    <meta name="robots" content="noindex, follow" />
    <meta http-equiv="refresh" content="0; url=/tools/coop/" />
    <script>
        (function () {
            var search = window.location.search || '';
            window.location.replace('/tools/coop/' + search);
        })();
    </script>
    <style>
        body { font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
               background: #0b0f19; color: #e5e7eb; min-height: 100vh; margin: 0;
               display: flex; align-items: center; justify-content: center; text-align: center; padding: 1rem; }
        a { color: #a5b4fc; }
    </style>
</head>
<body>
    <p>This page has moved to <a href="/tools/coop/">/tools/coop/</a>.</p>
</body>
