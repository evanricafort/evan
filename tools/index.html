<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects & Toolkits</title>
    <meta name="description" content="Browser-based security tools by Evan Ricafort — SPF, SSL, SSH, Nmap, JWT, source maps and more. Everything runs client-side." />
    <link href="/profile.jpg" type="image/jpeg" rel="shortcut icon" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: {
                        gray: {
                            850: '#1f2937',
                            900: '#111827',
                            950: '#0b0f19',
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body, div, p, span, h1, h2, h3, button, textarea, input, header {
            transition-property: color, background-color, border-color;
            transition-duration: 200ms;
        }

        .tk-anim-logo { display:inline-block; animation: tk-logo-float 4.5s ease-in-out infinite; transform-origin:center; }
        @keyframes tk-logo-float { 0%,100%{transform:translateY(0) rotate(0)} 25%{transform:translateY(-5px) rotate(-6deg)} 75%{transform:translateY(-2px) rotate(6deg)} }
        @media (prefers-reduced-motion: reduce){ .tk-anim-logo{animation:none} }
</style>
    <link rel="stylesheet" href="/css/tool-shell.css?v=dc126e22">
    <script src="/js/geo-web.js?v=1a4ffab0" defer></script>
    <script src="/js/theme-icon.js?v=0e129caa" defer></script>
</head>
<body class="bg-gray-100 text-gray-800 dark:bg-gray-950 dark:text-gray-200 font-sans min-h-screen flex flex-col items-center py-8 md:py-12 px-4 antialiased selection:bg-indigo-500 selection:text-white transition-colors duration-300">

    <div class="absolute top-4 right-4 md:top-8 md:right-8 z-30">
        <button id="btnThemeToggle" class="p-3 rounded-full bg-white dark:bg-gray-800 text-gray-600 dark:text-yellow-400 shadow-lg border border-gray-200 dark:border-gray-700 hover:scale-105 transition-transform focus:outline-none focus:ring-2 focus:ring-indigo-500" title="Toggle Dark Mode">
            <i data-lucide="moon" class="w-5 h-5 hidden dark:block"></i>
            <i data-lucide="sun" class="w-5 h-5 block dark:hidden"></i>
        </button>
    </div>

    <main class="w-full max-w-7xl space-y-8 mt-8">

        <div class="text-center space-y-3">
            <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight text-gray-900 dark:text-white flex items-center justify-center gap-3">
                <i data-lucide="wrench" class="tk-anim-logo w-9 h-9 md:w-12 md:h-12 text-indigo-600 dark:text-indigo-500"></i>
                <span><span class="text-indigo-600 dark:text-indigo-500">Personal </span>Projects & Toolkits</span>
            </h1>
            <p class="text-gray-600 dark:text-gray-400 text-sm md:text-lg max-w-xl mx-auto">
                Security research & browser-based tools for offensive security.
            </p>
        </div>

        <div class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3">
            <!-- Cards are rendered from /js/projects.js, the same list the
                 homepage reads, so both stay in the same order. -->


        </div>

        <div class="text-center pt-2">
            <a href="/" class="inline-flex items-center gap-2 text-sm font-medium text-gray-600 dark:text-gray-400 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                Back to evanricafort.com
            </a>
        </div>

    </main>

    <footer class="mt-auto py-8 text-center text-gray-500 dark:text-gray-600 text-xs font-medium">
        For authorized security testing only &nbsp;&middot;&nbsp; All processing runs client-side &nbsp;&middot;&nbsp; No data is stored
    </footer>

    <script src="/js/projects.js?v=570930cd"></script>
    <script>
        const htmlElement = document.documentElement;
        const btnThemeToggle = document.getElementById('btnThemeToggle');

        function toggleTheme() {
            if (htmlElement.classList.contains('dark')) {
                htmlElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                htmlElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        }

        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            htmlElement.classList.add('dark');
        } else {
            htmlElement.classList.remove('dark');
        }

        btnThemeToggle.addEventListener('click', toggleTheme);

        // Build the cards from the shared list, then let lucide swap in the
        // icons -- it only looks at what is in the DOM when it runs.
        (function renderCards() {
            const grid = document.querySelector(".grid");
            if (!grid || !window.PROJECTS) return;

            grid.innerHTML = window.PROJECTS.filter(function (p) { return p.card; }).map(function (p) {
                return '<a href="' + p.card.path + '" class="group bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-2xl p-6 shadow-xl dark:shadow-black/50 hover:border-indigo-400 dark:hover:border-indigo-500 hover:-translate-y-1 transition-all duration-200 flex flex-col gap-3">' +
                    '<div class="flex items-center gap-3">' +
                        '<span class="p-2.5 rounded-xl bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 flex-shrink-0">' +
                            '<i data-lucide="' + p.card.icon + '" class="w-5 h-5"></i>' +
                        '</span>' +
                        '<h2 class="font-bold text-base md:text-lg text-gray-900 dark:text-white leading-tight">' + p.card.title + '</h2>' +
                    '</div>' +
                    '<p class="text-sm text-gray-600 dark:text-gray-400 flex-1">' + p.card.description + '</p>' +
                    '<span class="text-xs font-mono text-indigo-600 dark:text-indigo-400 flex items-center gap-1.5">' + p.card.path +
                        '<i data-lucide="arrow-right" class="w-3.5 h-3.5 group-hover:translate-x-1 transition-transform"></i></span>' +
                '</a>';
            }).join("");
        })();

        lucide.createIcons();
    </script>

</body>
</html>
